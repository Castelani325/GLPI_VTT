services:
  app:
    container_name: "glpi-app"
    build:
      context: ".docker/app"
      args:
        PHP_VERSION: "8.4"
    restart: "always"
    volumes:
      - ".:/var/www/glpi:rw"
      - "custom_php_ini:/usr/local/etc/php/custom_conf.d/:rw"
    ports:
      - "8085:80"
      - "9637:9637"
    depends_on:
      - db
    environment:
      CYPRESS_BASE_URL: http://localhost:8085
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    container_name: "glpi-db"
    # Mantendo 10.11 igual à produção — upgrade de versão exige migração explícita dos dados
    image: "mariadb:10.11"
    restart: "always"
    volumes:
      # Host mount igual à produção: preserva os dados existentes em ./db
      - "./db:/var/lib/mysql"
    environment:
      MARIADB_ROOT_PASSWORD: "i.m96M;.O)rK1&Pf.|nt(OS2£j~r:#e*"
      MARIADB_DATABASE: "glpidb"
      MARIADB_USER: "glpiuser"
      MARIADB_PASSWORD: "glpipassword"
    ports:
      - "3306:3306"
    networks:
      default:
        aliases:
          # Alias para manter compatibilidade com o config_db.php que aponta para host "mysql"
          - mysql

  mailpit:
    container_name: "glpi-mailpit"
    image: "axllent/mailpit"
    restart: "unless-stopped"
    expose:
      - "1025"
    ports:
      - "8025:8025"

  dbgate:
    container_name: "glpi-dbgate"
    image: "dbgate/dbgate:latest"
    restart: "unless-stopped"
    ports:
      - "9000:3000"
    environment:
      CONNECTIONS: "glpi"

      LABEL_glpi: "GLPI Mysql Server"
      SERVER_glpi: "db"
      USER_glpi: "glpiuser"
      PASSWORD_glpi: "glpipassword"
      PORT_glpi: 3306
      ENGINE_glpi: "mysql@dbgate-plugin-mysql"

  # To create a preconfigured LDAP object in GLPI, run `make console c='tools:generate_dev_ldap'`
  openldap:
    container_name: "glpi-openldap"
    image: "osixia/openldap:latest"
    restart: "unless-stopped"
    environment:
      LDAP_ORGANISATION: "GLPI"
      LDAP_DOMAIN: "glpi.org"
      LDAP_ADMIN_USERNAME: "admin"
      LDAP_ADMIN_PASSWORD: "admin"
    command: "--copy-service"
    volumes:
      - "./tests/LDAP/ldif/10-users.ldif:/container/service/slapd/assets/config/bootstrap/ldif/50-bootstrap.ldif:rw"
      - "ldap_files:/var/lib/ldap:rw"
      - "ldap_config:/etc/ldap/slapd.d/:rw"

volumes:
  custom_php_ini:
  ldap_files:
  ldap_config:
